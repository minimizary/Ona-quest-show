<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONA QUEST — THE EXPERIENCE</title><style>
:root{--blue:#31A1DB;--deep:#0E74A4;--red:#FF3131;--ink:#15283a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;overflow:hidden}button{font:inherit;cursor:pointer;border:0}.top{position:fixed;z-index:5;top:0;left:0;right:0;padding:22px 4vw;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.13em}.brand b{color:var(--red)}.controls{display:flex;gap:10px;align-items:center}.small{background:#eaf6fc;color:var(--deep);border-radius:30px;padding:10px 15px;font-weight:700}.progress{position:fixed;bottom:0;height:5px;background:var(--red);transition:width .5s;z-index:10}.stage{height:100dvh;padding:95px 8vw 100px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.stage:after{content:'';position:absolute;width:32vw;height:32vw;background:#dff3fc;border-radius:50%;right:-14vw;bottom:-18vw;z-index:-1;filter:blur(5px)}.eyebrow{color:var(--deep);letter-spacing:.22em;font-size:13px;font-weight:900;text-transform:uppercase}.headline{font-size:clamp(55px,10vw,155px);line-height:.9;letter-spacing:-.075em;margin:22px 0;font-weight:950}.headline .red{color:var(--red)}.subtitle{font-size:clamp(20px,2.4vw,34px);max-width:850px;line-height:1.3}.actions{display:flex;flex-wrap:wrap;gap:15px;margin-top:38px}.cta{background:var(--red);color:#fff;border-radius:40px;padding:17px 28px;font-weight:900;box-shadow:0 10px 25px #ff313130}.outline{background:#fff;border:2px solid #d5e6ef;color:var(--deep);border-radius:40px;padding:15px 25px;font-weight:800}.nav{position:fixed;z-index:5;bottom:22px;left:4vw;right:4vw;display:flex;align-items:center;justify-content:space-between}.count{font-size:12px;color:#779;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}.tile{padding:28px;border-radius:25px;background:#f0f8fc;min-height:170px;transition:transform .2s,background .2s}.tile:hover{transform:translateY(-5px);background:#e2f3fc}.tile h3{font-size:clamp(20px,2vw,30px);margin:12px 0}.tile p{line-height:1.4}.emoji{font-size:42px}.bigNumber{font-size:clamp(85px,17vw,230px);font-weight:950;color:var(--red);line-height:1}.bar{background:#e5f1f6;border-radius:30px;height:25px;max-width:650px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--red));width:20%;transition:width 1s}.tag{display:inline-block;background:#eaf7fd;border-radius:30px;padding:12px 20px;margin:7px;font-weight:800;color:var(--deep)}.toast{position:fixed;top:90px;right:4vw;padding:16px 24px;background:var(--ink);color:#fff;border-radius:16px;z-index:15;box-shadow:0 15px 30px #0002;animation:pop .4s}.moti{position:absolute;right:12%;top:30%;width:160px;height:160px;background:var(--blue);border-radius:45% 50% 44% 48%;transform:rotate(-10deg);box-shadow:15px 18px 0 #d5f2ff;animation:bob 2.4s infinite}.moti:before{content:'●   ●';position:absolute;top:54px;left:43px;color:#fff;font-size:23px;letter-spacing:13px}.moti:after{content:'◡';position:absolute;top:73px;left:69px;color:#fff;font-size:32px}.slideIn{animation:enter .55s ease both}@keyframes enter{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}@keyframes bob{50%{transform:translateY(-14px) rotate(8deg)}}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:700px){.grid{grid-template-columns:1fr;gap:10px}.tile{min-height:90px;padding:14px}.tile p{display:none}.stage{padding:100px 7vw}.moti{opacity:.2;right:-30px}.top{padding:16px}.small{padding:9px}.headline{font-size:clamp(50px,12vw,90px)}.subtitle{font-size:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><header class="top"><div class="brand">ONA <b>QUEST</b> <span style="font-size:10px;color:#888">/ THE EXPERIENCE</span></div><div class="controls"><button class="small" id="mode" onclick="toggleMode()">👥 Команда</button><button class="small" onclick="document.documentElement.requestFullscreen?.()">⛶</button></div></header><main id="stage"></main><footer class="nav"><button class="small" onclick="go(-1)">← Назад</button><span class="count" id="counter"></span><button class="small" onclick="go(1)">Далее →</button></footer><div class="progress" id="progress"></div><script>
let page=0,lead=false,xp=20,done=false,look=0;const slides=[
()=>`<div class="eyebrow">ONA FOUNDATION · СЕКРЕТНАЯ ПРЕМЬЕРА</div><h1 class="headline">А ЧТО,<br>ЕСЛИ <span class="red">РАБОТА</span><br>— ЭТО ИГРА?</h1><p class="subtitle">У нас для вас кое-что есть. И нет, это не очередная таблица.</p><div class="actions"><button class="cta" onclick="go(1)">Узнать секрет →</button></div>`,

()=>`<div class="eyebrow">01 / СОЗДАЙ СВОЮ ГЕРОИНЮ</div><h1 class="headline" style="font-size:clamp(55px,8vw,110px)">ТВОЙ <span class="red">ПЕРСОНАЖ.</span></h1><p class="subtitle">Свой стиль, своя история, свой путь.</p><div class="grid"><div class="tile" style="text-align:center"><div class="emoji" id="avatar" style="font-size:90px">👩🏻‍💻</div><h3>Твой аватар</h3></div><div class="tile"><h3>Примерочная</h3><p>Причёски, хиджабы, глаза и одежда.</p><button class="cta" onclick="changeLook()">Сменить образ ↻</button></div><div class="tile"><h3>Базовый комплект</h3><p>Синие джинсы уже на тебе. Можно менять верх и стиль.</p></div></div>`,
()=>`<div class="eyebrow">02 / МИССИИ</div><h1 class="headline" style="font-size:clamp(60px,8vw,120px)">НЕ ЗАДАЧИ.<br><span class="red">МИССИИ.</span></h1><div class="grid"><div class="tile"><div class="emoji">📌</div><h3>Мне</h3><p>Мои текущие миссии</p></div><div class="tile"><div class="emoji">📝</div><h3>Созданы мной</h3><p>Миссии, которые я назначила</p></div><div class="tile"><div class="emoji">🔍</div><h3>На проверке / Сдано</h3><p>Результат не теряется</p></div></div><div class="actions"><button class="cta" onclick="complete()" id="mission">${done?'✓ Миссия выполнена':'✓ Выполнить демо-миссию'}</button></div>`,
()=>`<div class="eyebrow">03 / ОПЫТ И ПРОГРЕСС</div><h1 class="headline">+<span class="red">XP</span></h1><p class="subtitle">Каждое выполненное дело приближает к следующему уровню.</p><div class="bar"><div class="fill" style="width:${xp}%"></div></div><p class="subtitle">${xp} / 100 XP</p><button class="cta" onclick="gainXP()">+25 XP за миссию</button>`,
()=>`<div class="eyebrow">04 / ДОСТИЖЕНИЯ</div><h1 class="headline" style="font-size:clamp(60px,8vw,120px)">ТВОИ <span class="red">АЧИВКИ.</span></h1><div class="grid"><div class="tile"><div class="emoji">🏆</div><h3>Первый квест</h3><p>Первая выполненная миссия</p></div><div class="tile"><div class="emoji">⚡</div><h3>Турборежим</h3><p>Движение к цели</p></div><div class="tile"><div class="emoji">🤝</div><h3>Сила команды</h3><p>Общий результат</p></div></div><div class="actions"><button class="cta" onclick="notify('🏆 Ачивка разблокирована!')">Разблокировать достижение</button></div>`,
()=>`<div class="eyebrow">05 / МАГАЗИН БОНУСОВ</div><h1 class="headline" style="font-size:clamp(60px,8vw,120px)">ЗАРАБОТАЛА?<br><span class="red">ПОТРАТЬ.</span></h1><div class="grid"><div class="tile"><div class="emoji">🏡</div><h3>День удалёнки</h3><button class="outline" onclick="notify('🛍️ Демонстрационная покупка!')">Выбрать</button></div><div class="tile"><div class="emoji">☕</div><h3>Кофе или обед</h3><button class="outline" onclick="notify('🛍️ Демонстрационная покупка!')">Выбрать</button></div><div class="tile"><div class="emoji">🌴</div><h3>Доп. выходной</h3><button class="outline" onclick="notify('🛍️ Демонстрационная покупка!')">Выбрать</button></div></div>`,
()=>`<div class="eyebrow">06 / АКАДЕМИЯ ONA</div><h1 class="headline" style="font-size:clamp(60px,8vw,120px)">УЧИСЬ.<br><span class="red">РАСТИ.</span></h1><p class="subtitle">Добровольные тесты, новые знания и признание прогресса.</p><div class="actions"><button class="cta" onclick="notify('📚 Тест пройден! +XP (демо)')">Пройти мини-тест ✓</button></div>`,
()=>`<div class="eyebrow">07 / SELF-CARE</div><h1 class="headline" style="font-size:clamp(60px,8vw,120px)">ТЫ — <span class="red">ВАЖНА.</span></h1><p class="subtitle">Дыхательная пауза, чек-лист энергии, банк благодарностей. Не только результат, но и человек.</p><div class="actions"><button class="cta" onclick="notify('💙 Вдох 4 секунды · выдох 4 секунды')">Пауза на дыхание</button></div>`,
()=>`<div class="eyebrow">08 / СВОЁ ПРОСТРАНСТВО</div><h1 class="headline" style="font-size:clamp(60px,8vw,120px)">ТВОЯ <span class="red">КОМНАТА.</span></h1><p class="subtitle">Украшай своё пространство и отмечай личный прогресс.</p><div class="grid"><div class="tile"><div class="emoji">🛋️</div><h3>Мебель</h3></div><div class="tile"><div class="emoji">🪴</div><h3>Декор</h3></div><div class="tile"><div class="emoji">✨</div><h3>Новый уровень</h3></div></div>`,
()=>`<div class="eyebrow">09 / ДЛЯ РУКОВОДСТВА</div><h1 class="headline" style="font-size:clamp(50px,7vw,110px)">ИГРА ДЛЯ КОМАНДЫ.<br><span class="red">ПРОЗРАЧНОСТЬ ДЛЯ ФОНДА.</span></h1><div class="grid"><div class="tile"><div class="emoji">📊</div><h3>Статусы миссий</h3><p>Понятная картина работы</p></div><div class="tile"><div class="emoji">⏰</div><h3>Сроки</h3><p>Контроль этапов</p></div><div class="tile"><div class="emoji">🔗</div><h3>Маршруты</h3><p>Последовательность согласований PP-007</p></div></div>`,
()=>`<div class="eyebrow">ФИНАЛ / ТВОЯ СЛЕДУЮЩАЯ МИССИЯ</div><h1 class="headline">READY<br>PLAYER <span class="red">ONA?</span></h1><p class="subtitle">Мы создаём не просто трекер задач. Мы создаём новый опыт работы в команде.</p><div class="actions"><button class="cta" onclick="notify('🚀 ONA QUEST — LET’S GO!')">ПОЕХАЛИ 🚀</button><button class="outline" onclick="page=0;render()">С начала ↻</button></div>`];
function render(){document.getElementById('stage').innerHTML='<section class="stage slideIn">'+slides[page]()+'</section>';document.getElementById('counter').textContent=String(page+1).padStart(2,'0')+' / '+slides.length;document.getElementById('progress').style.width=((page+1)/slides.length*100)+'%'}function go(n){page=Math.min(slides.length-1,Math.max(0,page+n));render()}function notify(msg){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2600)}function toggleMode(){lead=!lead;document.getElementById('mode').textContent=lead?'📊 Руководство':'👥 Команда';page=lead?9:0;render()}function complete(){done=true;xp=Math.min(100,xp+25);notify('✨ Миссия выполнена! +25 XP');render()}function gainXP(){xp=Math.min(100,xp+25);render();notify(xp===100?'🎉 Новый уровень!':'⚡ +25 XP')}function changeLook(){look=(look+1)%4;document.getElementById('avatar').textContent=['👩🏻‍💻','🧕🏻','👩🏽‍💼','🧕🏽'][look];notify('✨ Новый образ!')}document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}});render();
</script></body></html>
